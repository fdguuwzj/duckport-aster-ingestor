[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aster-ingestor"
version = "0.1.0"
description = "Aster USDT-Perp K-line ingestor for duckport-rs"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=15.0",
    "aiohttp>=3.9",
    "websockets>=13.0",
    "python-dotenv>=1.0",
    "colorama>=0.4",
    "pytz",
    "duckdb==1.5.1",
    "lxml>=5.0",
    "aiofiles>=24.0",
    "tqdm>=4.60",
    "joblib>=1.3",
    "python-dateutil>=2.8",
    "numpy>=1.26",
]

[tool.setuptools.packages.find]
include = ["aster_ingestor*"]

[project.scripts]
aster-ingestor = "aster_ingestor.main:main"
loadhist = "aster_ingestor.loadhist:main"
